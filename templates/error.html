<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error {{ error_code }} - Attendance Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .error-card {
      max-width: 500px;
      width: 100%;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>

<div class="error-card">
  <div class="text-danger mb-3" style="font-size: 3.5rem;">
    <i class="bi bi-exclamation-triangle-fill"></i>
  </div>
  <h1 class="display-6 fw-bold text-dark">{{ error_code }}</h1>
  <h5 class="fw-semibold text-secondary mb-3">{{ error_title }}</h5>
  <p class="text-muted small mb-4">{{ error_message }}</p>
  <div class="d-flex justify-content-center gap-2">
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
      <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i> Go Back
    </a>
  </div>
</div>

</body>
</html>
